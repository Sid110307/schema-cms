[package]
name = "tauri-plugin-schema-cms"
version = "2.0.0"
description = "Tauri plugin backing schema-cms: data entry file access and media lookup"
edition.workspace = true
license.workspace = true
links = "tauri-plugin-schema-cms"

[dependencies]
dunce = "1"
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tempfile = "3"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
